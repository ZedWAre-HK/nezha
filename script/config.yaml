debug: false
httpport: 80
language: nz_language
grpcport: nz_grpc_port
oauth2:
  type: "nz_oauth2_type" # OAuth2 登录类型：github/gitlab/jihulab/gitee/gitea/cloudflare/oidc
  admin: "nz_admin_logins" # 管理员登录名，Cloudflare 填邮箱；多个值用半角逗号隔开
  clientid: "nz_github_oauth_client_id"
  clientsecret: "nz_github_oauth_client_secret"
  endpoint: "nz_oauth2_endpoint" # Gitea 填实例地址；Cloudflare 填 https://<team-name>.cloudflareaccess.com
site:
  brand: "nz_site_title"
  cookiename: "nezha-dashboard" #浏览器 Cookie 字段名，可不改
  theme: "default"
